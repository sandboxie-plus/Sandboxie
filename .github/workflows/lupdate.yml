name: Update language files

on:
  workflow_dispatch:
  schedule:
    # runs every night
    - cron: '0 1 * * *'

jobs:
  SBIE_Plus_lupdate:
    name: SBIE Plus lupdate
    # Skip the job on forks
    if: (github.event_name == 'schedule' && github.repository_owner == 'sandboxie-plus') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Install Qt 6 translation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends qt6-base-dev qt6-tools-dev-tools

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Sync Sbie Plus language strings (.ts files)
        id: check
        shell: bash
        working-directory: SandboxiePlus/SandMan
        run: |
          set -e
          /usr/lib/qt6/bin/lupdate SandMan.pri ../MiscHelpers/MiscHelpers.pri \
            -ts sandman_ar.ts \
                sandman_de.ts \
                sandman_en.ts \
                sandman_es.ts \
                sandman_fa.ts \
                sandman_fr.ts \
                sandman_hi.ts \
                sandman_hu.ts \
                sandman_it.ts \
                sandman_ja.ts \
                sandman_ko.ts \
                sandman_nb_NO.ts \
                sandman_nl.ts \
                sandman_pl.ts \
                sandman_pt_BR.ts \
                sandman_pt_PT.ts \
                sandman_ru.ts \
                sandman_sv_SE.ts \
                sandman_tr.ts \
                sandman_uk.ts \
                sandman_vi.ts \
                sandman_id.ts \
                sandman_zh_CN.ts \
                sandman_zh_TW.ts
          if git diff --exit-code; then
            echo "deploy=0" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
            echo "deploy=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit translations changes (if any)
        if: steps.check.outputs.deploy == '1'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync SBIE Plus language files (lupdate)"
          git pull --rebase=merges
          git push
          deploy_commit=$(git rev-parse HEAD)
          echo "Created commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$deploy_commit"

  SBIE_reports:
    name: SBIE reports
    # Skip the job on forks
    if: (github.event_name == 'schedule' && github.repository_owner == 'sandboxie-plus') || (github.event_name != 'schedule')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Sandboxie x86
        # This step is needed to compile Parse.vcxproj
        run: |
          msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8
          cd Sandboxie/msgs/SbieRelease
          copy Parse.exe ../

      - name: Check new Sbie strings found in Sbie-English-1033.txt
        id: check2
        shell: cmd
        working-directory: Sandboxie/msgs
        run: |
          .\RunReport.bat

      - name: Commit updated strings in Sandboxie/msgs/report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git clean -f -x
          git add -u Sandboxie/msgs/report/Report-*.txt
          git diff-index --quiet --cached HEAD || git commit -m "Update SBIE language reports (RunReport)"
          git pull --rebase=merges
          git push
          deploy2_commit=$(git rev-parse HEAD)
          echo "Created commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$deploy2_commit"
